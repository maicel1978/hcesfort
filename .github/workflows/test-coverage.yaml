# Test coverage; fails below 90% once the package has code to cover.
on:
  push:
    branches: [main]
  pull_request:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage
      - name: Coverage
        run: |
          cov <- covr::package_coverage()
          print(cov)
          pct <- covr::percent_coverage(cov)
          if (is.nan(pct)) {
            message("No code to cover yet.")
          } else if (pct < 90) {
            stop(sprintf("Coverage is %.1f%%, below the 90%% required.", pct))
          }
        shell: Rscript {0}
